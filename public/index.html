<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack a Mole</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="start-screen">
            <div class="brand-mark">🔨</div>
            <h1>Whack a Mole</h1>
            <p class="eyebrow">CASUAL BLITZ</p>
            <p>30 seconds.<br>How many can you hit?</p>

            <button class="play">PLAY</button>
            <button class="leaderboard">LEADERBOARD</button>
        </div>

        <div class="game-screen">
            <div class="status">
                <div class="stat">
                    <small>SCORE</small>
                    <strong class="score"><span>0</span></strong>
                </div>
                <div class="stat">
                    <small>TIME LEFT</small>
                    <strong class="time"><span>30</span>s</strong>
                </div>
            </div>

            <div class="countdown" aria-live="assertive"></div>

            <div class="board">
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
            </div>
        </div>

        <div class="game-over-screen">
            <div class="brand-mark">🔨</div>
            <h1>Game Over</h1>
            <p>Your Score: <span class="final-score">0</span></p>
            <button class="play-again">Play Again</button>
        </div>

        <footer class="site-footer">
            Created by Tridev · <a href="https://github.com/tridev-ops/whack-a-mole" target="_blank" rel="noopener noreferrer">GitHub repository</a>
        </footer>
    </div>

    <script src="./script.js"></script>
</body>

</html>
