<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack a Mole</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="start-screen">
            <h1>Whack a Mole</h1>
            <p>30 SECONDS. <br>HOW MANY CAN YOU HIT?</p>

            <button class="play">PLAY</button>
            <button class="leaderboard">LEADERBOARD</button>
        </div>

        <div class="game-screen">
            <div class="status">
                <div class="score">Score: <span>0</span></div>
                <div class="time">Time: <span>30</span></div>
            </div>

            <div class="countdown" aria-live="assertive"></div>

            <div class="board">
                <div class="hole">🐹</div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
            </div>
        </div>

        <div class="game-over-screen">
            <h1>Game Over</h1>
            <p>Your Score: <span class="final-score">0</span></p>
            <button class="play-again">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
